spring.application.name=ijspast-journal-api-test

# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:ijspast_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mocked or local mail settings
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

app.mail.from=${SMTP_FROM:${spring.mail.username:}}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000
app.file.upload-dir=./test-uploads

app.editor.email=${EDITOR_EMAIL:editor@journal.test}
